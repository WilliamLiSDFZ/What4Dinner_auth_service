server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: Your-Application-Name
  security:
    oauth2:
      client:
        registration:
          google:
            clientId:
            clientSecret:
            redirectUri: "https://example.com/api/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - email
              - profile
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/database}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  sql:
    init:
      mode: always

jwt:
  private-key: classpath:keys/your-private.pem
  public-key: classpath:keys/your-public.pem
  expiration-minutes: 720   # 12 hours
